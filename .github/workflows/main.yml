name: Deploy to S3

on:
  push:
    branches:
      - 'staticSite'  # Trigger the workflow on push to the branch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: staticSite  # Explicitly check out the staticSite branch
          fetch-depth: 0  # Fetch the entire history for diff checks

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_INTERIM_ROLE }}
          aws-region: us-east-1
          role-session-name: GitHub-OIDC-frontend
          
      # Step 3: Sync only changed files to S3

      - name: Debug
        run: aws s3 sync ./ s3://srophe-syriaca-front-end --delete --exact-timestamps --dryrun
      # - name: Sync changed files to S3
      #   run: |
          # aws s3 sync ./ s3://srophe-syriaca-front-end --delete --exact-timestamps
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
