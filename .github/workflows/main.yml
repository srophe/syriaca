name: Deploy to S3

on:
  push:
    branches:
      - 'staticSite'  # Trigger the workflow on push to the branch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch the full history for accurate diff comparisons
      
      # Explicitly check out the 'staticSite' branch
      - name: Ensure the correct branch is checked out
        run: |
          git checkout staticSite
          git branch --show-current  # Verify the checked-out branch

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials from AWS account
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_INTERIM_ROLE }}
          aws-region: us-east-1
          role-session-name: GitHub-OIDC-frontend
          
      # Step 3: Sync only changed files to S3

      # Ensure files are recognized as "newer" by updating timestamps
      - name: Update timestamps to ensure sync
        run: |
          find ./ -exec touch {} \;

      - name: Debug
        run: aws s3 sync ./ s3://srophe-syriaca-front-end --delete --exact-timestamps --dryrun
      # - name: Sync changed files to S3
      #   run: |
      #     aws s3 sync ./ s3://srophe-syriaca-front-end --delete --exact-timestamps
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
